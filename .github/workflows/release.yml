name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 태그가 manifest 버전과 같은지 확인
        run: node -e "const version=require('./manifest.json').version; if (process.env.GITHUB_REF_NAME!==version) { console.error('태그는 '+version+' 이어야 해요. v 는 붙이지 않아요.'); process.exit(1); }"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
